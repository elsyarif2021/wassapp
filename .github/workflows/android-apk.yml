name: Build WassApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-download

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --max-workers=2 --console=plain
      - name: Prepare download
        run: |
          mkdir -p apk-download
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-download/WassApp-debug.apk
          cd apk-download
          sha256sum WassApp-debug.apk > WassApp-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WassApp-Android-APK
          path: apk-download/
          if-no-files-found: error
          retention-days: 14
